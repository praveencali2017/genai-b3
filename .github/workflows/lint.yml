name: Lint

on:
  pull_request:
    paths:
      - "tasks/**"
      # Changes to the lint setup itself must be validated too.
      - ".github/workflows/lint.yml"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff (tasks/)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Lint
        run: uv run --locked --only-group dev ruff check --output-format=github tasks/
