[project]
name = "genai-b3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Praveen", email = "praveenknjun12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.2",
    "mysql-connector-python>=26.7.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
genai-b3 = "genai_b3:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.17.0",
]

[tool.ruff]
# Task scripts import sibling modules (e.g. db_config) directly. Treating every
# folder under tasks/ as a source root lets isort classify those imports as
# first-party, including folders added later.
src = ["src", "tasks/*"]

[tool.pytest.ini_options]
# FastAPI task packages (e.g. student_ms) import themselves by absolute name.
pythonpath = ["tasks/fastapi_crud_pgms"]
testpaths = ["tasks/fastapi_crud_pgms"]
