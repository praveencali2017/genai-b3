<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Management</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --text:#1f2328; --muted:#656d76; --border:#d0d7de;
            --accent:#2563eb; --danger:#dc2626; --user:#dbeafe; --bot:#f3f4f6; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text); }
    header { padding:16px 24px; background:var(--card); border-bottom:1px solid var(--border); }
    h1 { margin:0; font-size:20px; }
    h2 { margin:0 0 12px; font-size:16px; }
    main { display:grid; grid-template-columns: minmax(0,2fr) minmax(320px,1fr); gap:16px; padding:16px 24px; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; padding:16px; } }
    .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; }
    .stack { display:flex; flex-direction:column; gap:16px; min-width:0; }
    form.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:10px; }
    label { display:flex; flex-direction:column; font-size:13px; color:var(--muted); gap:4px; }
    input { font:inherit; padding:7px 9px; border:1px solid var(--border); border-radius:6px; color:var(--text); }
    .actions { grid-column:1/-1; display:flex; gap:8px; }
    button { font:inherit; padding:7px 14px; border-radius:6px; border:1px solid var(--border); background:#fff; cursor:pointer; }
    button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    button.danger { color:var(--danger); }
    button:disabled { opacity:.6; cursor:default; }
    .toolbar { display:flex; justify-content:space-between; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid var(--border); white-space:nowrap; }
    th { font-size:13px; color:var(--muted); font-weight:600; }
    td.row-actions { display:flex; gap:6px; }
    .empty { color:var(--muted); text-align:center; padding:20px; }
    .status { min-height:20px; font-size:13px; margin-top:8px; }
    .status.error { color:var(--danger); }
    .chat { display:flex; flex-direction:column; height:calc(100vh - 110px); min-height:420px; }
    #chat-log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:4px 0; }
    .msg { padding:8px 12px; border-radius:10px; max-width:90%; white-space:pre-wrap; }
    .msg.user { align-self:flex-end; background:var(--user); }
    .msg.assistant { align-self:flex-start; background:var(--bot); }
    .msg.error { align-self:flex-start; background:#fee2e2; color:var(--danger); }
    #chat-form { display:flex; gap:8px; margin-top:8px; }
    #chat-form input { flex:1; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
    .hint { font-size:13px; color:var(--muted); margin:0 0 8px; }

    /* architecture toggle: radios styled as a segmented control */
    .modes { border:0; padding:0; margin:0 0 6px; }
    .modes legend { font-size:13px; color:var(--muted); padding:0; margin-bottom:4px; }
    .segments { display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
    .segments label { flex:1; display:block; position:relative; font-size:13px; color:var(--text); }
    .segments input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
    .segments span { display:block; text-align:center; padding:6px 8px; border-left:1px solid var(--border); }
    .segments label:first-child span { border-left:0; }
    .segments input:checked + span { background:var(--accent); color:#fff; }
    .segments input:focus-visible + span { outline:2px solid var(--accent); outline-offset:-4px; }

    /* per-reply trace of what each agent did */
    .trace { align-self:flex-start; max-width:90%; font-size:13px; }
    .trace > summary { cursor:pointer; color:var(--muted); }
    .run { border-left:3px solid var(--accent); padding:4px 0 4px 10px; margin-top:6px; }
    .run.failed { border-left-color:var(--danger); }
    .run-agent { font-weight:600; }
    .steps { margin:4px 0 0; padding-left:20px; }
    .steps li { margin:4px 0; }
    .steps code { white-space:pre-wrap; word-break:break-word; }
    .step-error { color:var(--danger); }
    .step-result { color:var(--muted); }
    .steps pre { margin:4px 0 0; padding:6px; background:var(--bg); border-radius:4px;
                 white-space:pre-wrap; word-break:break-word; max-height:200px; overflow:auto; }
    .returned { margin-top:4px; white-space:pre-wrap; }
    .muted { color:var(--muted); }
  </style>
</head>
<body>
  <header><h1>Employee Management</h1></header>

  <main>
    <div class="stack">
      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">Add employee</h2>
        <form id="employee-form" class="grid">
          <input type="hidden" name="id">
          <label>Name <input name="name" required maxlength="100"></label>
          <label>Email <input name="email" type="email" required></label>
          <label>Department <input name="department" required maxlength="100"></label>
          <label>Position <input name="position" required maxlength="100"></label>
          <label>Salary <input name="salary" type="number" min="0" step="0.01" required></label>
          <label>Hire date <input name="hire_date" type="date"></label>
          <div class="actions">
            <button type="submit" class="primary" id="submit-btn">Add</button>
            <button type="button" id="cancel-btn" hidden>Cancel edit</button>
          </div>
        </form>
        <div id="form-status" class="status" role="status"></div>
      </section>

      <section class="card" aria-labelledby="list-title">
        <div class="toolbar">
          <h2 id="list-title">Employees</h2>
          <input id="search" type="search" placeholder="Search…" aria-label="Search employees">
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Position</th>
                  <th>Salary</th><th>Hire date</th><th><span class="sr-only">Actions</span></th></tr>
            </thead>
            <tbody id="employee-rows"></tbody>
          </table>
        </div>
      </section>
    </div>

    <section class="card chat" aria-labelledby="chat-title">
      <h2 id="chat-title">Assistant</h2>
      <fieldset class="modes">
        <legend>Architecture</legend>
        <div class="segments">
          <label><input type="radio" name="mode" value="tool_calling" checked><span>Tool calling</span></label>
          <label><input type="radio" name="mode" value="single_agent"><span>Single agent</span></label>
          <label><input type="radio" name="mode" value="multi_agent"><span>Multi-agent</span></label>
        </div>
      </fieldset>
      <p class="hint" id="mode-hint"></p>
      <p class="hint">Try: "Add Priya, priya@acme.com, Engineering, Backend Developer, 95000" ·
        "List everyone in Engineering" · "Change Priya's salary to 100000" · "Delete employee 3"</p>
      <div id="chat-log" aria-live="polite"></div>
      <form id="chat-form">
        <input id="chat-input" placeholder="Ask me to manage employees…" autocomplete="off" required aria-label="Message">
        <button type="submit" class="primary">Send</button>
      </form>
    </section>
  </main>

  <script>
    const API = "/api/employees";
    const form = document.getElementById("employee-form");
    const rows = document.getElementById("employee-rows");
    const formStatus = document.getElementById("form-status");
    const searchInput = document.getElementById("search");
    let employees = [];

    async function request(url, options = {}) {
      const response = await fetch(url, {
        headers: { "Content-Type": "application/json" }, ...options,
      });
      if (response.status === 204) return null;
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(describeError(body, response.status));
      return body;
    }

    function describeError(body, statusCode) {
      if (typeof body.detail === "string") return body.detail;
      if (Array.isArray(body.detail)) {
        return body.detail.map(d => `${d.loc.at(-1)}: ${d.msg}`).join("; ");
      }
      return `Request failed (${statusCode})`;
    }

    function setStatus(element, message, isError = false) {
      element.textContent = message;
      element.classList.toggle("error", isError);
    }

    function cell(text) {
      const td = document.createElement("td");
      td.textContent = text ?? "";
      return td;
    }

    function button(label, onClick, className = "") {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = label;
      b.className = className;
      b.addEventListener("click", onClick);
      return b;
    }

    function renderEmployees() {
      rows.replaceChildren();
      if (employees.length === 0) {
        const tr = document.createElement("tr");
        const td = cell(searchInput.value ? "No employees match your search." : "No employees yet.");
        td.colSpan = 8;
        td.className = "empty";
        tr.append(td);
        rows.append(tr);
        return;
      }
      for (const e of employees) {
        const tr = document.createElement("tr");
        const actions = document.createElement("td");
        actions.className = "row-actions";
        actions.append(
          button("Edit", () => startEdit(e)),
          button("Delete", () => removeEmployee(e), "danger"),
        );
        tr.append(cell(e.id), cell(e.name), cell(e.email), cell(e.department), cell(e.position),
                  cell(e.salary.toLocaleString()), cell(e.hire_date), actions);
        rows.append(tr);
      }
    }

    async function loadEmployees() {
      const search = searchInput.value.trim();
      const url = search ? `${API}?search=${encodeURIComponent(search)}` : API;
      try {
        employees = await request(url);
        renderEmployees();
      } catch (error) {
        setStatus(formStatus, error.message, true);
      }
    }

    function readForm() {
      const data = Object.fromEntries(new FormData(form));
      const id = data.id;
      delete data.id;
      data.salary = Number(data.salary);
      data.hire_date = data.hire_date || null;
      return { id, data };
    }

    function startEdit(employee) {
      for (const [key, value] of Object.entries(employee)) {
        if (form.elements[key]) form.elements[key].value = value ?? "";
      }
      document.getElementById("form-title").textContent = `Edit employee #${employee.id}`;
      document.getElementById("submit-btn").textContent = "Save";
      document.getElementById("cancel-btn").hidden = false;
      setStatus(formStatus, "");
      form.elements.name.focus();
    }

    function resetForm() {
      form.reset();
      form.elements.id.value = "";
      document.getElementById("form-title").textContent = "Add employee";
      document.getElementById("submit-btn").textContent = "Add";
      document.getElementById("cancel-btn").hidden = true;
    }

    async function removeEmployee(employee) {
      if (!confirm(`Delete ${employee.name}?`)) return;
      try {
        await request(`${API}/${employee.id}`, { method: "DELETE" });
        setStatus(formStatus, `Deleted ${employee.name}.`);
        if (form.elements.id.value === String(employee.id)) resetForm();
        await loadEmployees();
      } catch (error) {
        setStatus(formStatus, error.message, true);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const { id, data } = readForm();
      const submit = document.getElementById("submit-btn");
      submit.disabled = true;
      try {
        const saved = id
          ? await request(`${API}/${id}`, { method: "PATCH", body: JSON.stringify(data) })
          : await request(API, { method: "POST", body: JSON.stringify(data) });
        setStatus(formStatus, `${id ? "Updated" : "Added"} ${saved.name}.`);
        resetForm();
        await loadEmployees();
      } catch (error) {
        setStatus(formStatus, error.message, true);
      } finally {
        submit.disabled = false;
      }
    });

    document.getElementById("cancel-btn").addEventListener("click", () => {
      resetForm();
      setStatus(formStatus, "");
    });

    let searchTimer;
    searchInput.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(loadEmployees, 250);
    });

    // ---- chat: history lives in the browser and is sent with each message
    const chatLog = document.getElementById("chat-log");
    const chatForm = document.getElementById("chat-form");
    const chatInput = document.getElementById("chat-input");
    const history = [];

    // ---- architecture toggle (the choice is a per-browser convenience)
    const MODES = {
      tool_calling: { label: "Tool calling", hint: "One model calls the five tools directly." },
      single_agent: { label: "Single agent",
                      hint: "One agent plans, reads, writes, then verifies, one tool call at a time." },
      multi_agent: { label: "Multi-agent",
                     hint: "A supervisor delegates to a read agent and a write agent." },
    };
    const MODE_STORAGE_KEY = "employee-chat-mode";
    const modeInputs = document.querySelectorAll('input[name="mode"]');

    function selectedMode() {
      return document.querySelector('input[name="mode"]:checked').value;
    }

    function showModeHint() {
      document.getElementById("mode-hint").textContent = MODES[selectedMode()].hint;
    }

    function restoreMode() {
      let saved = null;
      try { saved = localStorage.getItem(MODE_STORAGE_KEY); } catch { /* storage blocked */ }
      const input = [...modeInputs].find(i => i.value === saved);
      if (input) input.checked = true;
      showModeHint();
    }

    for (const input of modeInputs) {
      input.addEventListener("change", () => {
        try { localStorage.setItem(MODE_STORAGE_KEY, selectedMode()); } catch { /* storage blocked */ }
        showModeHint();
      });
    }

    // ---- trace rendering: what each agent did for one reply
    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function formatArguments(args) {
      if (typeof args !== "object" || args === null) return String(args);
      // Strict schemas send null for every unused field; hide them to keep it readable.
      const provided = Object.fromEntries(Object.entries(args).filter(([, v]) => v !== null));
      return JSON.stringify(provided);
    }

    function summarizeResult(step) {
      const result = step.result;
      if (step.is_error) return `error: ${result?.error ?? JSON.stringify(result)}`;
      if (Array.isArray(result)) return `${result.length} employee${result.length === 1 ? "" : "s"}`;
      if (result?.deleted) return `deleted #${result.deleted.id} ${result.deleted.name}`;
      if (result?.id !== undefined) return `#${result.id} ${result.name}`;
      return JSON.stringify(result);
    }

    function renderToolStep(step) {
      const li = element("li");
      li.append(element("code", "", `${step.tool}(${formatArguments(step.arguments)})`));
      li.append(" → ", element("span", step.is_error ? "step-error" : "step-result", summarizeResult(step)));
      const details = element("details");
      details.append(element("summary", "muted", "result"),
                     element("pre", "", JSON.stringify(step.result, null, 2)));
      li.append(details);
      return li;
    }

    function renderDelegationStep(step) {
      const li = element("li");
      li.append(element("div", "", `→ asked ${step.run.agent}: ${step.run.input}`));
      li.append(renderRun(step.run));
      li.append(element("div", step.run.is_error ? "returned step-error" : "returned",
                        `← ${step.run.agent} returned: ${step.run.output}`));
      return li;
    }

    function renderRun(run) {
      const box = element("div", run.is_error ? "run failed" : "run");
      box.append(element("div", "run-agent", run.agent));
      if (run.steps.length === 0) {
        box.append(element("div", "muted", "No tools used"));
        return box;
      }
      const list = element("ol", "steps");
      for (const step of run.steps) {
        list.append(step.kind === "delegate" ? renderDelegationStep(step) : renderToolStep(step));
      }
      box.append(list);
      return box;
    }

    function countRun(run) {
      let agents = 1, toolCalls = 0;
      for (const step of run.steps) {
        if (step.kind === "delegate") {
          const nested = countRun(step.run);
          agents += nested.agents;
          toolCalls += nested.toolCalls;
        } else {
          toolCalls += 1;
        }
      }
      return { agents, toolCalls };
    }

    function renderTrace(mode, trace) {
      const { agents, toolCalls } = countRun(trace);
      const details = element("details", "trace");
      details.append(element("summary", "",
        `What the agents did · ${MODES[mode].label} · ${agents} agent run${agents === 1 ? "" : "s"}, ` +
        `${toolCalls} tool call${toolCalls === 1 ? "" : "s"}`));
      details.append(renderRun(trace));
      return details;
    }

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      chatLog.append(div);
      chatLog.scrollTop = chatLog.scrollHeight;
      return div;
    }

    chatForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = "";
      addMessage("user", text);
      history.push({ role: "user", content: text });
      const sendButton = chatForm.querySelector("button");
      sendButton.disabled = true;
      const pending = addMessage("assistant", "Thinking…");
      try {
        const { reply, mode, trace } = await request("/api/chat", {
          method: "POST", body: JSON.stringify({ messages: history, mode: selectedMode() }),
        });
        pending.textContent = reply;
        pending.after(renderTrace(mode, trace));
        chatLog.scrollTop = chatLog.scrollHeight;
        history.push({ role: "assistant", content: reply });
        await loadEmployees();  // the assistant may have changed the data
      } catch (error) {
        pending.className = "msg error";
        pending.textContent = error.message;
        history.pop();  // drop the unanswered message so it isn't resent
      } finally {
        sendButton.disabled = false;
        chatInput.focus();
      }
    });

    restoreMode();
    loadEmployees();
  </script>
</body>
</html>
