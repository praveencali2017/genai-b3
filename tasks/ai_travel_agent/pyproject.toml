[project]
name = "ai-travel-agent"
version = "0.1.0"
description = "Travel booking app with a REST API, a web UI and one AI chatbot that plans trips, cites policy documents (RAG) and books packages through a single tool-calling agent"
readme = "README.md"
authors = [
    { name = "Praveen", email = "praveenknjun12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "chromadb>=1.5.9",
    # PyMySQL needs it to log in to MySQL 8 (caching_sha2_password).
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.163.1",
    "httpx>=0.28.1",
    "openai>=3.51.0",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "pymysql>=1.2.4",
    "python-docx>=1.2.0",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
travel-api = "ai_travel_agent.cli:run_api"
travel-seed = "ai_travel_agent.cli:run_seed"
travel-index = "ai_travel_agent.cli:run_index"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "scripts", "migrations"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ai_travel_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mysql: needs a MySQL test database in TEST_DATABASE_URL (skipped when unset)",
]
filterwarnings = [
    # PyMuPDF's SWIG bindings, not this project.
    "ignore:builtin type [Ss]wig:DeprecationWarning",
]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "pytest>=9.2.0",
    "ruff>=0.17.0",
]
